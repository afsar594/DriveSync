<ion-header>
  <ion-toolbar>

    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/dashboard"></ion-back-button>
    </ion-buttons>

    <ion-title>Live Tracking</ion-title>

  </ion-toolbar>
</ion-header>

<ion-content>

  <div class="map-wrapper">
    <div #mapContainer class="map-container"></div>
  </div>

  <ion-button expand="block" color="success" (click)="startTracking()">
    Start Tracking
  </ion-button>

  <ion-button expand="block" color="danger" (click)="stopTracking()">
    Stop
  </ion-button>

</ion-content>
