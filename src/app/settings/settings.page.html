<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
  <ion-button (click)="goBack()">
    <ion-icon name="chevron-back-outline"></ion-icon>
  </ion-button>
</ion-buttons>


    <ion-title>Settings</ion-title>
    
  </ion-toolbar>
</ion-header>


<ion-content class="settings-bg">

  <!-- 👤 ACCOUNT -->
  <ion-card class="card">
    <ion-card-header>
      <ion-card-title>Account</ion-card-title>
    </ion-card-header>

    <ion-list>

      <ion-item button (click)="openModal('profile')">
  <ion-icon name="person-outline" slot="start"></ion-icon>
  <ion-label>Edit Profile</ion-label>
</ion-item>

<ion-item button (click)="openModal('email')">
  <ion-icon name="mail-outline" slot="start"></ion-icon>
  <ion-label>Change Email</ion-label>
</ion-item>

<ion-item button (click)="openModal('password')">
  <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
  <ion-label>Change Password</ion-label>
</ion-item>

    </ion-list>
  </ion-card>

  <!-- 🚗 VEHICLE -->
  <ion-card class="card">
    <ion-card-header>
      <ion-card-title>Vehicle</ion-card-title>
    </ion-card-header>

    <ion-list>

      <ion-item button>
        <ion-icon name="car-outline" slot="start"></ion-icon>
        <ion-label>My Vehicles</ion-label>
      </ion-item>

      <ion-item button>
        <ion-icon name="add-circle-outline" slot="start"></ion-icon>
        <ion-label>Add Vehicle</ion-label>
      </ion-item>

    </ion-list>
  </ion-card>

  <!-- 📍 TRACKING -->
  <ion-card class="card">
    <ion-card-header>
      <ion-card-title>Tracking</ion-card-title>
    </ion-card-header>

    <ion-item>
      <ion-icon name="navigate-outline" slot="start"></ion-icon>
      <ion-label>Enable Tracking</ion-label>
      <ion-toggle></ion-toggle>
    </ion-item>

    <ion-item>
      <ion-icon name="speedometer-outline" slot="start"></ion-icon>
      <ion-label>High Accuracy</ion-label>
      <ion-toggle></ion-toggle>
    </ion-item>

    <ion-item>
      <ion-icon name="time-outline" slot="start"></ion-icon>
      <ion-label>Auto Update</ion-label>
      <ion-toggle></ion-toggle>
    </ion-item>

  </ion-card>

  <!-- 🔔 NOTIFICATIONS -->
  <ion-card class="card">
    <ion-card-header>
      <ion-card-title>Notifications</ion-card-title>
    </ion-card-header>

    <ion-item>
      <ion-icon name="notifications-outline" slot="start"></ion-icon>
      <ion-label>Speed Alert</ion-label>
      <ion-toggle></ion-toggle>
    </ion-item>

    <ion-item>
      <ion-icon name="location-outline" slot="start"></ion-icon>
      <ion-label>Geo Fence Alert</ion-label>
      <ion-toggle></ion-toggle>
    </ion-item>

  </ion-card>

  <!-- 🌙 APP -->
  <ion-card class="card">
    <ion-card-header>
      <ion-card-title>App Settings</ion-card-title>
    </ion-card-header>

    <ion-item>
      <ion-icon name="moon-outline" slot="start"></ion-icon>
      <ion-label>Dark Mode</ion-label>
      <ion-toggle></ion-toggle>
    </ion-item>

    <ion-item>
      <ion-icon name="language-outline" slot="start"></ion-icon>
      <ion-label>Language</ion-label>
    </ion-item>

  </ion-card>

  <!-- 🔒 SECURITY -->
  <ion-card class="card">
    <ion-card-header>
      <ion-card-title>Security</ion-card-title>
    </ion-card-header>

    <ion-item button>
      <ion-icon name="finger-print-outline" slot="start"></ion-icon>
      <ion-label>App Lock</ion-label>
    </ion-item>

    <ion-item button>
      <ion-icon name="trash-outline" slot="start"></ion-icon>
      <ion-label>Clear Data</ion-label>
    </ion-item>

  </ion-card>

  <!-- 🔴 LOGOUT -->
  <div class="logout">
    <ion-button expand="block" color="danger">
      <ion-icon name="log-out-outline" slot="start"></ion-icon>
      Logout
    </ion-button>
  </div>

  <!-- CUSTOM POPUP -->

<div
  class="popup-overlay"
  *ngIf="isModalOpen"
  [class.closing]="isClosing">

  <div class="custom-popup">

    <!-- HEADER -->

    <div class="popup-header">

      <h2>{{ modalTitle }}</h2>

      <ion-icon
        name="close-outline"
        (click)="closeModal()">
      </ion-icon>

    </div>

    <!-- EDIT PROFILE -->

    <div *ngIf="modalType === 'profile'">

      <div class="custom-input">
        <label>Full Name</label>
        <input type="text" placeholder="Enter full name">
      </div>

      <div class="custom-input">
        <label>Phone Number</label>
        <input type="text" placeholder="Enter phone number">
      </div>

      <div class="custom-input">
        <label>Username</label>
        <input type="text" placeholder="Enter username">
      </div>

      <button
  class="save-btn"
  (click)="saveAction('Profile updated successfully')">

  Save Changes

</button>

    </div>

    <!-- CHANGE EMAIL -->

    <div *ngIf="modalType === 'email'">

      <div class="custom-input">
        <label>Current Email</label>
        <input type="email" placeholder="Current email">
      </div>

      <div class="custom-input">
        <label>New Email</label>
        <input type="email" placeholder="New email">
      </div>

      <button
  class="save-btn"
  (click)="saveAction('Email changed successfully')">

  Update Email

</button>

    </div>

    <!-- CHANGE PASSWORD -->

    <div *ngIf="modalType === 'password'">

      <div class="custom-input">
        <label>Current Password</label>
        <input type="password" placeholder="Current password">
      </div>

      <div class="custom-input">
        <label>New Password</label>
        <input type="password" placeholder="New password">
      </div>

      <div class="custom-input">
        <label>Confirm Password</label>
        <input type="password" placeholder="Confirm password">
      </div>

      <button
  class="save-btn"
  (click)="saveAction('Password changed successfully')">

  Change Password

</button>

    </div>

  </div>

</div>

</ion-content>
